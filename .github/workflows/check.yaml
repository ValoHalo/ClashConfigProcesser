name: check

on:
  push:
    branches: ['main', 'modified']
    paths:
      - 'Script/**'
      - 'Tools/**'
      - 'Test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check.yaml'
  pull_request:
    branches: ['main', 'modified']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: check scripts and generated config
        run: npm run check
