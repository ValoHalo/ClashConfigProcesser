name: check

on:
  push:
    branches: ['main', 'modified']
    paths:
      - 'Script/**'
      - 'Tools/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: ['main', 'modified']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: check scripts and generated config
        run: npm run check
